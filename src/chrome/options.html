<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Elephant — Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 20px;
      background: #edeae5;
      color: #263422;
    }
    .panel {
      background: #fffdfb;
      border: 1px solid rgba(78,68,60,.09);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 18px 38px rgba(67,53,38,.10);
    }
    h1 { font-size: 24px; color: #2e4a28; font-weight: 800; margin-bottom: 24px; }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 12px;
      color: #6f8b61;
      margin-bottom: 7px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #f7f5f1;
      border: 1.5px solid rgba(111,139,97,.22);
      border-radius: 14px;
      color: #263422;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #6f8b61; background: #fff; }
    input::placeholder { color: #9b968f; }
    .hint { font-size: 12px; color: #89837b; margin-top: 6px; line-height: 1.35; }
    button {
      width: 100%;
      padding: 13px 20px;
      background: #3d5c38;
      color: #fff;
      border: 1px solid #3d5c38;
      border-radius: 14px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(61,92,56,.22);
    }
    button:hover { background: #344f30; }
    #status { margin-top: 14px; font-size: 13px; color: #3d5c38; min-height: 18px; text-align: center; }
    #status.err { color: #b6493d; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Settings</h1>

    <div class="field">
      <label>Server URL</label>
      <input id="serverUrl" type="text" placeholder="http://localhost:3001">
      <div class="hint">Use http://localhost:3001 while the bot runs on this machine.</div>
    </div>

    <div class="field">
      <label>API Token</label>
      <input id="apiToken" type="password" placeholder="Paste token from /mytoken">
      <div class="hint">Run <strong>/mytoken</strong> in Discord once, then paste the token here.</div>
    </div>

    <button id="save">Save settings</button>
    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
