<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 320px;
      padding: 16px;
      background: #edeae5;
      color: #263422;
    }
    .panel {
      background: #fffdfb;
      border: 1px solid rgba(78,68,60,.09);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 14px 30px rgba(67,53,38,.10);
    }
    label {
      font-size: 12px;
      color: #6f8b61;
      display: block;
      margin-bottom: 6px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    textarea {
      width: 100%;
      height: 86px;
      padding: 12px;
      border: 1.5px solid rgba(111,139,97,.22);
      border-radius: 14px;
      background: #f7f5f1;
      color: #263422;
      font-size: 15px;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #6f8b61; background: #fff; }
    textarea::placeholder { color: #9b968f; }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 800;
      transition: background .12s, transform .08s;
    }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #study-btn {
      margin-top: 12px;
      background: #3d5c38;
      color: #fff;
      border: 1px solid #3d5c38;
      box-shadow: 0 8px 18px rgba(61,92,56,.22);
    }
    #study-btn:hover { background: #344f30; }
    #send {
      margin-top: 10px;
      background: #fff;
      color: #3d5c38;
      border: 1.5px solid rgba(61,92,56,.22);
    }
    #send:hover { background: #f4f2ee; }
    #wordlist-btn {
      margin-top: 10px;
      background: #fff;
      color: #3d5c38;
      border: 1.5px solid rgba(61,92,56,.22);
    }
    #wordlist-btn:hover { background: #f4f2ee; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 16px;
      color: #7b8278;
    }
    #status.ok { color: #3d5c38; }
    #status.err { color: #b6493d; }
    .hint {
      margin-top: 12px;
      font-size: 11px;
      line-height: 1.35;
      color: #89837b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="panel">
    <label>Words to add</label>
    <textarea id="words" placeholder="eloquent verbose laconic"></textarea>
    <button id="send">Add words</button>
    <button id="wordlist-btn">My words</button>
    <button id="study-btn">Review mode</button>
    <div id="status"></div>
    <div class="hint">Right-click selected text on any page to add words faster.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
